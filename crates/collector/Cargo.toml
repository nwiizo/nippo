[package]
name = "nippo"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
description = "Claude Code, Codex, and GitHub Copilot session collector for daily reports"
license = "MIT"
repository = "https://github.com/nwiizo/nippo"
keywords = ["copilot", "daily-report", "reflection", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "nippo"
path = "src/main.rs"

[features]
# Interactive read-only ledger dashboard. Off by default so the headless
# `nippo ledger` path (used by the skill) has no extra dependencies.
tui = ["dep:ratatui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rayon = "1"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = "0.37"
ratatui = { version = "0.29", optional = true }

[dev-dependencies]
tempfile = "3"
